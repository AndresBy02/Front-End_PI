services:
  db:
    image: postgres:16-alpine
    container_name: saici-postgres
    restart: always
    environment:
      POSTGRES_DB: saici_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD_Saici.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: saici-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saici.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: .
    container_name: saici-backend
    restart: always
    depends_on:
      - db
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: saici_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: saici_super_secret_jwt_token_2026_uceva
      EMAIL_USER: soporte@uceva.edu.co
      EMAIL_PASS: dummy_password
    ports:
      - "3000:3000"

volumes:
  postgres_data: